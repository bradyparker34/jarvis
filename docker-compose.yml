# Postgres with pgvector built in. Nothing leaves this machine.
#
# The port is bound to 127.0.0.1 on purpose: the database is not reachable from
# the network even if you are on a cafe wifi.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: jarvis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis_local_dev}
      POSTGRES_DB: jarvis
    ports:
      - "127.0.0.1:5464:5432"
    volumes:
      - jarvis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  jarvis_data:
